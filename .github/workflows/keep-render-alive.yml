name: Keep Render Service Alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          curl --fail --silent --show-error \
          https://ssms-backend-fastapi-ypge.onrender.com/
